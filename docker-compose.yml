# Meilisearch — self-hosted search engine (typo tolerance, instant search).
# Usage:
#   docker compose up -d meilisearch
#   Open http://localhost:7700 (uses MEILI_MASTER_KEY from your .env)
#
# Production: run the same image on your VPS / Fly / Railway, set a strong
# MEILI_MASTER_KEY, put it behind TLS, and persist the ./meili_data volume.

services:
  meilisearch:
    image: getmeili/meilisearch:v1.11
    container_name: dreams-yatri-meili
    restart: unless-stopped
    ports:
      - "7700:7700"
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-masterKeyChangeMe}
      MEILI_ENV: ${MEILI_ENV:-development}
      MEILI_NO_ANALYTICS: "true"
    volumes:
      - meili_data:/meili_data
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--spider", "http://localhost:7700/health"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  meili_data:
