name: CI

on:
  push:
    branches: [main, master]
  pull_request:

# Cancel superseded runs on the same branch/PR instead of piling them up.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Ephemeral, CI-only values — this pipeline never talks to any real
  # payment gateway, storage bucket, or messaging provider. Every spec that
  # exercises the dashboard/hotel-connect/website surfaces is self-contained
  # (Playwright's global-setup seeds its own DB fixtures and mints its own
  # session cookies), so none of these need to be real secrets.
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/dreams_yatri_ci
  AUTH_SECRET: ci-only-throwaway-secret-do-not-use-in-prod
  NEXTAUTH_URL: http://localhost:3000
  NEXT_PUBLIC_BASE_URL: http://localhost:3000
  NEXT_PUBLIC_API_URL: http://localhost:3000
  RAZORPAY_KEY_ID: rzp_test_placeholder
  RAZORPAY_KEY_SECRET: rzp_test_placeholder_secret
  RAZORPAY_WEBHOOK_SECRET: rzp_test_placeholder_webhook
  NEXT_PUBLIC_RAZORPAY_KEY_ID: rzp_test_placeholder
  PAYU_KEY: payu_test_placeholder
  PAYU_SALT: payu_test_placeholder_salt
  PAYU_BASE_URL: https://test.payu.in
  PAYMENT_PROVIDER: razorpay
  QUOTE_SECRET: ci-only-quote-secret
  QUOTE_TTL_MINUTES: "30"
  RECON_STALE_MINUTES: "60"
  NOTIFICATIONS_ENABLED: "false"
  WHATSAPP_ENABLED: "false"
  MAIL_FROM: ci@dreamsyatri.internal
  OPS_EMAIL: ci-ops@dreamsyatri.internal
  CRON_SECRET: ci-only-cron-secret
  NEXT_PUBLIC_MAPBOX_TOKEN: pk.placeholder
  NEXT_PUBLIC_MSG91_WIDGET_ID: placeholder
  NEXT_PUBLIC_MSG91_TOKEN_AUTH: placeholder
  MSG91_API_KEY: placeholder
  MSG91_COMPANY_ID: placeholder
  MSG91_TOKEN_AUTH: placeholder
  R2_ACCESS_KEY: placeholder
  R2_SECRET_KEY: placeholder
  R2_ENDPOINT: https://placeholder.r2.cloudflarestorage.com
  R2_BUCKET: placeholder
  NEXT_PUBLIC_R2_PUBLIC_URL: https://placeholder.example.com
  ABLY_API_KEY: placeholder.placeholder:placeholder
  RESEND_API_KEY: placeholder
  GOOGLE_CLIENT_ID: placeholder
  GOOGLE_CLIENT_SECRET: placeholder
  MEILI_HOST: http://localhost:7700
  MEILI_MASTER_KEY: placeholder

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dreams_yatri_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prisma generate
        run: npx prisma generate

      - name: Apply migrations
        run: npx prisma migrate deploy

      - name: Seed baseline content (destinations, packages, hotels, policies)
        run: npx prisma db seed

      - name: Typecheck
        run: npx tsc --noEmit -p tsconfig.json

      # Only the DB-independent unit suites — test:quote needs a
      # "manali-honeymoon-package" fixture prisma/seed.ts doesn't create
      # (it seeds "manali-adventure" instead), so it can't run here yet.
      # See PR/commit notes for the follow-up to reconcile the two.
      - name: Unit tests (money, policy, cancellation, notifications, checkout, gateway signatures/providers)
        run: |
          npm run test:money
          npm run test:policy
          npm run test:cancel
          npm run test:notify
          npm run test:checkout
          npm run test:razorpay
          npm run test:payments

      - name: Build
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: E2E tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
